name: Project checks

on: [pull_request, merge_group]

permissions:
  contents: read

jobs:
  check:
    name: mbus-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
